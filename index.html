<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
  <style>
    table { border-collapse: collapse; width: 50%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
    form { margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>To-Do List</h1>
  <form method="POST" action="/add">
    <input type="text" name="text" placeholder="Введите задачу" required>
    <button type="submit">Добавить</button>
  </form>
  <table>
    <thead>
      <tr>
        <th>Number</th>
        <th>Text</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      {{rows}}
    </tbody>
  </table>
</body>
</html>
