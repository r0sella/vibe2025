<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
</head>
<body>
  <h1>To-Do List</h1>
  <table>
    <thead>
      <tr>
        <th>Number</th>
        <th>Text</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      {{rows}}
    </tbody>
  </table>
  <form method="POST" action="/add" style="margin-top: 10px;">
    <input type="text" name="text" placeholder="Введите задачу" required>
    <button type="submit">Add</button>
  </form>
  <script>
    function showEditForm(id) {
      document.querySelectorAll('.edit-form').forEach(f => f.style.display = 'none');
      document.querySelectorAll('.task-text').forEach(t => t.style.display = '');
      document.getElementById('edit-form-' + id).style.display = '';
      document.getElementById('task-text-' + id).style.display = 'none';
      return false;
    }
    function hideEditForm(id) {
      document.getElementById('edit-form-' + id).style.display = 'none';
      document.getElementById('task-text-' + id).style.display = '';
      return false;
    }
  </script>
</body>
</html>
